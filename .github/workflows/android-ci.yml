name: Android CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ nexus-hardening-v1 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
